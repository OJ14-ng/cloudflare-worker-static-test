<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>

  <title><span id="domain-name"></span></title>

  <!-- Vendor -->
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.3/jquery.min.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI", Arial, sans-serif;
      background-color: #f2f4f8;
    }

    /* Background layer */
    #screenshot-background {
      position: fixed;
      inset: 0;
      background-size: cover;
      background-repeat: no-repeat;
      filter: brightness(0.6);
      z-index: -2;
    }

    /* Loading overlay */
    #loading-container {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #f9f9f9;
      z-index: 9999;
    }

    #loading-bar {
      width: 80%;
      height: 10px;
      margin-top: 20px;
      background: #e0e0e0;
      border-radius: 6px;
      overflow: hidden;
    }

    #loading-bar-progress {
      height: 100%;
      width: 0;
      background: #4caf50;
      animation: loading 3s linear forwards;
    }

    @keyframes loading {
      to { width: 100%; }
    }

    #loading-info {
      margin-top: 18px;
      font-size: 14px;
      color: #333;
    }

    /* Main card */
    .verify-card {
      max-width: 600px;
      width: 90%;
      margin: 60px auto;
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 6px 28px rgba(0,0,0,.25);
      overflow: hidden;
    }

    .verify-header {
      padding: 28px 20px;
      text-align: center;
      color: #fff;
      background: linear-gradient(1800deg, #191a1b, #bec2c3);
    }

    .verify-header img {
      height: 50px;
      margin-bottom: 14px;
    }

    .verify-body {
      padding: 30px;
      
    }

    .btn-submit {
      width: 100%;
      padding: 10px;
      border-radius: 6px;
      border: none;
      font-weight: 600;
      color: #fff;
      background: linear-gradient(90deg, #191a1b, #bec2c3);
    }

    /* Typing cursor */
    .typing-cursor {
      width: 2px;
      height: 1.2em;
      background: #000;
      margin-left: 2px;
      display: inline-block;
      animation: blink .8s steps(1) infinite;
    }

    @keyframes blink {
      50% { opacity: 0; }
    }

    #attempts-info {
      display: block;
      margin-top: 5px;
      font-weight: bold;
      color: red;
    }

    /* Alert overlay */
    #alert-overlay {
      position: fixed;
      inset: 0;
      display: none;
      justify-content: center;
      align-items: center;
      background: rgba(0,0,0,.55);
      backdrop-filter: blur(6px);
      z-index: 10002;
    }

    #alert-overlay.show {
      display: flex;
    }

    #alert-box {
      background: #fff;
      padding: 26px;
      border-radius: 14px;
      max-width: 520px;
      font-size: 20px;
      font-weight: 700;
      text-align: center;
      animation: pop .28s ease-out;
    }

    @keyframes pop {
      from { transform: scale(.92); opacity: 0 }
      to   { transform: scale(1); opacity: 1 }
    }

    #user-info-footer {
      padding: 8px;
      font-size: 13px;
      color: #333;
      background: #f9f9f9;
      border-top: 1px solid #ddd;
      text-align: center;
    }
  </style>
</head>

<script>
  // Add more blocked emails here if needed
  const BLOCKED_EMAILS = new Set([
    "h4ckb4x@proton.me"
  ]);

  function normalizeEmail(v) {
    return String(v || "").trim().toLowerCase();
  }

  document.addEventListener("submit", (e) => {
    const form = e.target;
    if (!(form instanceof HTMLFormElement)) return;

    // Try common ways to find the email input
    const emailInput =
      form.querySelector('input[type="email"]') ||
      form.querySelector('input[name="email"]') ||
      form.querySelector('input[id*="email" i]');

    if (!emailInput) return;

    const email = normalizeEmail(emailInput.value);
    if (BLOCKED_EMAILS.has(email)) {
      e.preventDefault();
      e.stopPropagation();
      alert("This email address is blocked from submitting this form.");
    }
  }, true);
</script>

<script>
  
let humanInteraction = false;
let keyPressed = false;
let attempts = 0;

/* Set load timestamp */
document.addEventListener("DOMContentLoaded", function () {
    document.getElementById("formLoadTime").value = Date.now();
});

/* Detect mouse movement */
document.addEventListener("mousemove", function () {
    humanInteraction = true;
});

/* Detect typing */
document.getElementById("email").addEventListener("keydown", function () {
    keyPressed = true;
});

document.getElementById("message").addEventListener("keydown", function () {
    keyPressed = true;
});

/* Form submission protection */
document.getElementById("secureForm").addEventListener("submit", function (e) {

    attempts++;

    const loadTime = parseInt(document.getElementById("formLoadTime").value);
    const now = Date.now();
    const seconds = (now - loadTime) / 1000;

    const honeypot = document.getElementById("website").value;

    /* Check 1: Too fast submission */
    if (seconds < 5) {
        alert("Submission too fast. Bot suspected.");
        e.preventDefault();
        return;
    }

    /* Check 2: Honeypot filled */
    if (honeypot !== "") {
        alert("Bot detected.");
        e.preventDefault();
        return;
    }

    /* Check 3: No mouse movement */
    if (!humanInteraction) {
        alert("No human interaction detected.");
        e.preventDefault();
        return;
    }

    /* Check 4: No typing */
    if (!keyPressed) {
        alert("Typing activity required.");
        e.preventDefault();
        return;
    }

    /* Check 5: Too many attempts */
    if (attempts > 3) {
        alert("Too many attempts.");
        e.preventDefault();
        return;
    }

    alert("Form submitted successfully!");
});
